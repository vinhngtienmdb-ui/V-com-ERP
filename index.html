<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VComm ERP</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Global error handler: Log to console instead of injecting intrusive overlay into DOM
      window.addEventListener('unhandledrejection', function(event) {
        const reason = event?.reason?.message || event?.reason || '';
        if (typeof reason === 'string' && (
          reason.includes('WebSocket closed without opened') || 
          reason.includes('ResizeObserver loop') ||
          reason.includes('canceled')
        )) {
          // Benign browser/network lifecycle event: prevent console spam
          event.preventDefault();
          return;
        }
        console.warn('[VComm App Warning]', event.reason);
      });
      window.process = { env: {} };
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 48px; height: 48px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: vcomm-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 16px; font-weight: 600; letter-spacing: 0.025em;">VComm ERP</div>
        <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Đang tải ứng dụng...</div>
        <style>
          @keyframes vcomm-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
