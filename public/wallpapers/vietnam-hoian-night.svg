<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Night Sky Gradient over Hoai River -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="45%" stop-color="#14172e" />
      <stop offset="70%" stop-color="#2a1b32" />
      <stop offset="100%" stop-color="#0f0d1a" />
    </linearGradient>

    <!-- Warm Lantern Gradients -->
    <radialGradient id="lanternYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <radialGradient id="lanternRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="75%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>

    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <g id="silkLantern">
      <ellipse cx="0" cy="0" rx="35" ry="50" fill="url(#lanternYellow)" />
      <path d="M 0,-50 C 15,-20 15,20 0,50 C -15,20 -15,-20 0,-50 Z" fill="#fef08a" opacity="0.4" />
      <rect x="-12" y="-55" width="24" height="6" rx="2" fill="#78350f" />
      <rect x="-10" y="49" width="20" height="5" rx="2" fill="#78350f" />
      <!-- Golden Tassel -->
      <line x1="0" y1="54" x2="0" y2="85" stroke="#fbbf24" stroke-width="2.5" />
      <circle cx="0" cy="88" r="4" fill="#fbbf24" />
    </g>

    <g id="silkLanternRed">
      <ellipse cx="0" cy="0" rx="40" ry="48" fill="url(#lanternRed)" />
      <path d="M 0,-48 C 18,-20 18,20 0,48 C -18,20 -18,-20 0,-48 Z" fill="#ffe4e6" opacity="0.4" />
      <rect x="-14" y="-53" width="28" height="6" rx="2" fill="#4c0519" />
      <rect x="-12" y="47" width="24" height="5" rx="2" fill="#4c0519" />
      <line x1="0" y1="52" x2="0" y2="85" stroke="#fda4af" stroke-width="2.5" />
      <circle cx="0" cy="88" r="4" fill="#fda4af" />
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#nightSky)" />

  <!-- River water reflection bottom layer -->
  <rect y="720" width="1920" height="360" fill="#090a14" opacity="0.9" />

  <!-- Old Town Ancient House Silhouettes -->
  <path d="M 0,720 L 0,520 L 120,470 L 220,530 L 350,460 L 500,540 L 700,480 L 850,550 L 1050,470 L 1200,530 L 1400,460 L 1600,540 L 1800,480 L 1920,520 L 1920,720 Z" fill="#0d0e1a" />

  <!-- Lantern String Lights across Ancient Streets -->
  <path d="M 50,220 Q 300,320 600,240 T 1200,260 T 1880,210" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.6" />
  <path d="M 120,380 Q 400,460 800,390 T 1500,420 T 1900,360" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.5" />

  <!-- Hanging Glowing Lanterns -->
  <circle cx="280" cy="290" r="140" fill="url(#lanternGlow)" />
  <use href="#silkLantern" transform="translate(280, 290) scale(0.9)" />

  <circle cx="580" cy="245" r="130" fill="url(#lanternGlow)" />
  <use href="#silkLanternRed" transform="translate(580, 245) scale(0.85)" />

  <circle cx="900" cy="280" r="170" fill="url(#lanternGlow)" />
  <use href="#silkLantern" transform="translate(900, 280) scale(1.1)" />

  <circle cx="1250" cy="265" r="140" fill="url(#lanternGlow)" />
  <use href="#silkLanternRed" transform="translate(1250, 265) scale(0.95)" />

  <circle cx="1600" cy="230" r="150" fill="url(#lanternGlow)" />
  <use href="#silkLantern" transform="translate(1600, 230) scale(1)" />

  <!-- Floating River Flower Lanterns (Hoa Đăng Sông Hoài) -->
  <g opacity="0.8">
    <ellipse cx="400" cy="850" rx="35" ry="8" fill="#f59e0b" opacity="0.6" filter="blur(6px)" />
    <polygon points="400,820 415,845 385,845" fill="#fbbf24" />
    <circle cx="400" cy="830" r="6" fill="#fef08a" />

    <ellipse cx="850" cy="910" rx="45" ry="10" fill="#f43f5e" opacity="0.6" filter="blur(8px)" />
    <polygon points="850,880 870,905 830,905" fill="#f43f5e" />
    <circle cx="850" cy="890" r="7" fill="#ffe4e6" />

    <ellipse cx="1300" cy="870" rx="40" ry="9" fill="#f59e0b" opacity="0.6" filter="blur(7px)" />
    <polygon points="1300,840 1318,865 1282,865" fill="#fbbf24" />
    <circle cx="1300" cy="850" r="6" fill="#fef08a" />
  </g>

  <!-- Title Accent -->
  <text x="80" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#fef08a" opacity="0.75" letter-spacing="4">HỘI AN ĐÊM HOA ĐĂNG</text>
  <text x="80" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" opacity="0.6" letter-spacing="2">DI SẢN VĂN HÓA THẾ GIỚI</text>
</svg>
